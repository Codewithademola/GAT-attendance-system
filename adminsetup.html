<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Setup</title>
    <script type="module" src="./JS/admisetup.js"></script>

</head>

<body>

    <h2>Create First Admin</h2>

    <form id="adminSetupForm">

        <input
            type="text"
            id="adminName"
            placeholder="Full Name"
            required
        >

        <br><br>

        <input
            type="email"
            id="adminEmail"
            placeholder="Admin Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="adminPassword"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Create Admin
        </button>

    </form>

    <p id="message"></p>


 

</body>

</html>
